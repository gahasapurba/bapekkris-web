<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23003d79'/><path d='M50 18 L50 82 M32 38 L68 38' stroke='%23ffb800' stroke-width='8' stroke-linecap='round'/><circle cx='50' cy='38' r='4' fill='%23ffffff'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bapekkris" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1424" media="(prefers-color-scheme: dark)" />
    <title>Bapekkris Bank Mandiri — Badan Pembinaan Kerohanian Kristen</title>
    <meta name="description" content="Website resmi Bapekkris (Badan Pembinaan Kerohanian Kristen) PT Bank Mandiri (Persero) Tbk: persekutuan, ibadah, renungan harian, Alkitab, kidung pujian, dan pelayanan kasih insan Mandiri." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://bapekkris-mandiri.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bapekkris Bank Mandiri" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="Bapekkris Bank Mandiri — Badan Pembinaan Kerohanian Kristen" />
    <meta property="og:description" content="Website resmi Bapekkris PT Bank Mandiri (Persero) Tbk: persekutuan, ibadah, renungan harian, Alkitab, dan kidung pujian." />
    <meta property="og:url" content="https://bapekkris-mandiri.netlify.app/" />
    <meta property="og:image" content="https://bapekkris-mandiri.netlify.app/assets/mandiri-club-bapekkris-original.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Organization","name":"Bapekkris Bank Mandiri","alternateName":"Badan Pembinaan Kerohanian Kristen PT Bank Mandiri (Persero) Tbk.","url":"https://bapekkris-mandiri.netlify.app/","logo":"https://bapekkris-mandiri.netlify.app/assets/mandiri-club-bapekkris-original.png"}
    </script>
    <script>
      // Same rule as src/lib/theme.ts, applied before first paint to avoid a theme flash.
      (function () {
        var theme = 'light';
        try { theme = localStorage.getItem('bapekkris_theme_choice') || ''; } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static first paint (same header as SiteHeader); React replaces it once the app has loaded -->
      <div class="flex min-h-screen flex-col" aria-hidden="true">
        <header class="sticky top-0 z-[100] border-b border-line bg-[var(--bg-nav)]">
          <div class="mx-auto flex h-[72px] max-w-[1260px] items-center gap-4 px-4 md:px-6">
            <span class="flex min-w-0 items-center gap-3">
              <img id="boot-logo" src="/assets/web/bapekkris-logo.webp" width="228" height="112" alt="" class="h-9 w-auto shrink-0 object-contain" />
              <span class="h-7 w-px shrink-0 bg-line"></span>
              <span class="flex min-w-0 flex-col leading-none">
                <span class="font-display text-[1.15rem] font-semibold tracking-[-0.01em] text-ink">Bapekkris</span>
                <span class="mt-1 text-[0.66rem] font-semibold uppercase tracking-[0.18em] text-dim">Bank Mandiri</span>
              </span>
            </span>
          </div>
        </header>
      </div>
      <script>
        if (document.documentElement.getAttribute('data-theme') === 'dark') document.getElementById('boot-logo').src = '/assets/web/bapekkris-logo-white.webp';
      </script>
    </div>
    <noscript>Website Bapekkris Bank Mandiri memerlukan JavaScript. Aktifkan JavaScript di browser Anda.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
