[build]
  command = "npm run build"
  publish = "dist"

# SPA Catch-all navigation fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Self-hosted fonts never change under the same name (a new version gets a new file name)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for every page: no framing by other sites, no MIME sniffing,
# no full URLs leaked to other sites, and only the camera (QR check-in) allowed.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"
